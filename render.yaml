services:
  - type: web
    name: bha-rss
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://prarmzkwkvgteyvoherj.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BHA_RSS_KEY
        generateValue: true
      - key: APIFY_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DASHBOARD_INBOUND_KEY
        sync: false
